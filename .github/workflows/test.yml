name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.source_sha }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [24, 26]
        # Release calls validate every pair; routine CI keeps each OS and Node major.
        exclude: ${{ fromJSON(inputs.source_sha && '[]' || '[{"os":"windows-latest","node":26},{"os":"macos-latest","node":26}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
      # Both suites build with tsc, including type checking, on every matrix entry.
      - name: Full test suite
        if: ${{ inputs.source_sha || (matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
        run: npm test
      - name: CLI smoke tests
        if: ${{ !inputs.source_sha && (matrix.os != 'ubuntu-latest' || matrix.node != 24) }}
        run: npm run test:smoke
      - run: npm pack --ignore-scripts
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
      - run: npm run test:release
        if: ${{ !inputs.source_sha && matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
